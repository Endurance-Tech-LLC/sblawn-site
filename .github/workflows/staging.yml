# On-demand staging deploy: Actions → "Deploy to staging" → Run workflow → pick any branch.
#
# Runs in the `staging` GitHub environment, whose AZURE_CLIENT_ID points at a
# staging-only Azure login (gh-sblawn-site-staging). That login can push images
# and update ca-sblawn-staging, but cannot touch production.
name: Deploy to staging

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC login to Azure, no stored secrets

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy ${{ github.ref_name }} to staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name "${{ vars.ACR_NAME }}"
      # Separate image repository so branch builds never mix with production tags.
      - id: meta
        run: echo "image=${{ vars.ACR_LOGIN_SERVER }}/sblawn-site-staging:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Update Container App image
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ steps.meta.outputs.image }}"
      # Staging scales to zero when idle, so the first request can take ~20 s.
      - name: Smoke test
        run: curl --fail --silent --show-error --retry 8 --retry-delay 10 --retry-all-errors --max-time 60 "${{ vars.SITE_URL }}/"
      - name: Summary
        run: echo "Deployed \`${{ github.ref_name }}\` (${{ github.sha }}) to ${{ vars.SITE_URL }}" >> "$GITHUB_STEP_SUMMARY"
